<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>talk · alma</title>
<style>
  :root {
    --bg: #0b0b0e;
    --panel: #131318;
    --border: #23232c;
    --amber: #d4a853;
    --amber-dim: #8a6a35;
    --text: #e8e2d4;
    --muted: #7a7468;
    --red: #b94a3e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 'SF Mono', Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
    -webkit-text-size-adjust: 100%;
  }
  .hidden { display: none !important; }

  /* ---------- login ---------- */
  #login-view {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .login-card h1 { font-size: 22px; font-weight: normal; color: var(--amber); margin-bottom: 6px; }
  .login-card p { color: var(--muted); font-size: 12px; margin-bottom: 26px; }
  .login-card input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 12px 14px;
    font: inherit;
    outline: none;
    margin-bottom: 14px;
  }
  .login-card input:focus { border-color: var(--amber-dim); }
  .login-card button {
    width: 100%;
    background: var(--amber);
    color: #16130a;
    border: none;
    border-radius: 6px;
    padding: 12px;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  .login-card button:hover { opacity: 0.9; }
  .login-err { color: var(--red); font-size: 12px; min-height: 18px; margin-top: 12px; }

  /* ---------- chat ---------- */
  #chat-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
  }
  header .brand { color: var(--amber); font-size: 15px; }
  header .brand span { color: var(--muted); }
  header .controls { display: flex; gap: 16px; align-items: center; }
  header label { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px; }
  header button {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 4px 10px;
    font: inherit;
    cursor: pointer;
  }
  header button:hover { color: var(--text); border-color: var(--amber-dim); }

  #transcript {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #1d1a12; border: 1px solid #2e2818; }
  .msg.alma { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .msg.thinking { color: var(--muted); font-style: italic; border: none; background: none; }
  .msg.live { border-style: dashed; color: var(--muted); }
  .msg .who { display: block; font-size: 10px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }

  #status-line {
    padding: 8px 18px;
    font-size: 12px;
    color: var(--amber-dim);
    min-height: 34px;
    text-align: center;
  }
   #status-line.listening { color: var(--red); }

   #env-line {
     padding: 0 18px 6px;
     font-size: 10px;
     color: var(--muted);
     text-align: center;
     opacity: .7;
   }


  footer {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-top: 1px solid var(--border);
  }
  #mic-btn {
    flex: 0 0 auto;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 1px solid var(--amber-dim);
    background: var(--panel);
    color: var(--amber);
    font-size: 22px;
    cursor: pointer;
    transition: all 0.15s;
  }
  #mic-btn:hover { border-color: var(--amber); }
  #mic-btn.active {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(185,74,62,0.5); } 100% { box-shadow: 0 0 0 16px rgba(185,74,62,0); } }
  #text-input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 12px 14px;
    font: inherit;
    outline: none;
  }
  #text-input:focus { border-color: var(--amber-dim); }
  #send-btn {
    flex: 0 0 auto;
    background: var(--amber);
    color: #16130a;
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  #send-btn:hover { opacity: 0.9; }
  #mic-btn.disabled { opacity: 0.35; cursor: not-allowed; }
</style>
</head>
<body>

<div id="login-view">
  <div class="login-card">
    <h1>talk · alma</h1>
    <p>voice room. password first.</p>
    <input type="password" id="pw" placeholder="password" autocomplete="current-password">
    <button id="login-btn">enter</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div id="chat-view" class="hidden">
  <header>
    <div class="brand">talk · <span>alma</span></div>
    <div class="controls">
      <label><input type="checkbox" id="voice-toggle" checked> voice replies</label>
      <button id="logout-btn">leave</button>
    </div>
  </header>
  <div id="transcript"></div>
   <div id="status-line">tap the mic. talk.</div>
   <div id="env-line"></div>
   <footer>
    <button id="mic-btn" title="tap to talk">&#9679;</button>
    <input type="text" id="text-input" placeholder="or type…" autocomplete="off">
    <button id="send-btn">send</button>
   </footer>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  function addMsg(who, text) {
    var t = $('transcript');
    var d = document.createElement('div');
    d.className = 'msg ' + who;
    var w = document.createElement('span');
    w.className = 'who';
    w.textContent = who === 'user' ? 'kevin' : 'alma';
    d.appendChild(w);
    d.appendChild(document.createTextNode(text));
    t.appendChild(d);
    t.scrollTop = t.scrollHeight;
    return d;
  }

  function addThinking() {
    var t = $('transcript');
    var d = document.createElement('div');
    d.className = 'msg thinking';
    d.textContent = 'thinking…';
    t.appendChild(d);
    t.scrollTop = t.scrollHeight;
    return d;
  }

  function showLogin() {
    $('login-view').classList.remove('hidden');
    $('chat-view').classList.add('hidden');
  }
  function showChat() {
    $('login-view').classList.add('hidden');
    $('chat-view').classList.remove('hidden');
    $('pw').value = '';
  }

  function api(path, body) {
    return fetch(path, {
      method: body ? 'POST' : 'GET',
      headers: body ? { 'Content-Type': 'application/json' } : {},
      credentials: 'same-origin',
      body: body ? JSON.stringify(body) : undefined
    });
  }

  // diagnostics: show locally and ship to the backend so we stop guessing
  function diag(msg) {
    try { $('env-line').textContent = msg; } catch (e) {}
    try { api('/api/log', { msg: msg }).catch(function () {}); } catch (e) {}
  }
  window.addEventListener('error', function (e) { diag('page error: ' + (e.message || 'unknown')); });
  window.addEventListener('unhandledrejection', function (e) {
    diag('promise error: ' + ((e.reason && e.reason.message) || 'unknown'));
  });

  /* ---------- auth ---------- */
  $('login-btn').addEventListener('click', doLogin);
  $('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  function doLogin() {
    unlockSpeech();
    $('login-err').textContent = '';
    api('/api/login', { password: $('pw').value })
      .then(function (r) {
        if (r.ok) { showChat(); greet(); }
        else { $('login-err').textContent = 'no. try again.'; }
      })
      .catch(function () { $('login-err').textContent = 'can\'t reach the room.'; });
  }
  $('logout-btn').addEventListener('click', function () {
    api('/api/logout').then(function () { showLogin(); });
  });

  function greet() {
    addMsg('alma', 'hi kevin. room\'s open. say something or type it.');
  }

  /* ---------- shared state ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var srBroken = false;
  var rec = null;
  var listening = false;
  var wantListening = false;
  var speaking = false;
  var awaitingReply = false;
  var voiceOn = true;
  var curAudio = null;
  var pendingFinal = '';
  var finalTimer = null;
  var interimBubble = null;

  var RESTART_DELAY = 400;
  var RESTART_CAP = 30;

  /* ---------- speech recognition (chrome — streams interim live) ---------- */
  function srAvailable() { return !!SR && !srBroken; }

  function tryStart() {
    if (!rec || !wantListening || speaking || awaitingReply) return;
    if (restartCount >= RESTART_CAP) {
      wantListening = false;
      listening = false;
      $('mic-btn').classList.remove('active');
      $('status-line').classList.remove('listening');
      $('status-line').textContent = 'mic went quiet — tap again.';
      return;
    }
    restartCount++;
    try { rec.start(); } catch (e) { /* not ready — a later resume will retry */ }
  }

  function scheduleResume(delay) {
    if (!wantListening) return;
    setTimeout(function () {
      if (srAvailable()) tryStart();
    }, delay || RESTART_DELAY);
  }

  function setInterim(text) {
    if (!text) {
      if (interimBubble) { interimBubble.parentNode.removeChild(interimBubble); interimBubble = null; }
      return;
    }
    if (!interimBubble) {
      interimBubble = addMsg('user', '');
      interimBubble.classList.add('live');
      interimBubble.querySelector('.who').textContent = 'kevin · listening';
    }
    // addMsg appended a text node — replace the bubble's text content
    interimBubble.innerHTML = '<span class="who">kevin · listening</span>';
    interimBubble.appendChild(document.createTextNode(text));
    var t = $('transcript');
    t.scrollTop = t.scrollHeight;
  }

  function flushPending() {
    var text = pendingFinal.trim();
    pendingFinal = '';
    if (!text) return;
    send(text);
  }

  var restartCount = 0;

  function initSR() {
    rec = new SR();
    rec.lang = 'en-US';
    rec.interimResults = true;
    rec.continuous = true;

    rec.onstart = function () {
      listening = true;
      restartCount = 0;
      diag('mic start');
      $('mic-btn').classList.add('active');
      $('status-line').classList.add('listening');
      $('status-line').textContent = 'listening… speak naturally, tap to stop';
    };
    rec.onend = function () {
      listening = false;
      diag('mic end — ' + (wantListening ? 'restart queued' : 'off'));
      if (wantListening && !speaking && !awaitingReply) {
        scheduleResume();
      } else {
        $('mic-btn').classList.remove('active');
        $('status-line').classList.remove('listening');
        $('status-line').textContent = wantListening ? 'thinking…' : 'tap the mic. talk.';
      }
    };
    rec.onerror = function (e) {
      diag('mic error: ' + e.error);
      if (e.error === 'not-allowed') {
        wantListening = false;
        listening = false;
        $('mic-btn').classList.remove('active');
        $('status-line').classList.remove('listening');
        $('status-line').textContent = 'mic blocked — allow it in the browser, or type.';
      } else if (e.error === 'network' || e.error === 'service-not-allowed') {
        // chrome's google-backed recognition is unreachable — fall back to the recorder
        srBroken = true;
        wantListening = false;
        listening = false;
        $('mic-btn').classList.remove('active');
        $('status-line').classList.remove('listening');
        $('status-line').textContent = 'cloud recognition unreachable — using on-device recording instead. tap the mic.';
      } else if (e.error === 'aborted') {
        // our own stop — onend handles it
      } else if (e.error === 'no-speech') {
        if (wantListening) $('status-line').textContent = 'still listening… say something';
      } else {
        wantListening = false;
        listening = false;
        $('mic-btn').classList.remove('active');
        $('status-line').classList.remove('listening');
        $('status-line').textContent = 'mic error: ' + e.error;
      }
    };
    rec.onresult = function (e) {
      var interim = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) {
          pendingFinal += e.results[i][0].transcript;
        } else {
          interim += e.results[i][0].transcript;
        }
      }
      setInterim(interim);
      if (pendingFinal.trim()) {
        setInterim('');
        // debounce — chrome sometimes splits one sentence into rapid finals
        if (finalTimer) clearTimeout(finalTimer);
        finalTimer = setTimeout(function () {
          if (listening) { try { rec.stop(); } catch (e2) { /* fine */ } }
          flushPending();
        }, 350);
      }
    };
  }

  /* ---------- recorder (firefox / safari / broken sr) ---------- */
  var recording = false;
  var mediaRecorder = null;
  var mediaStream = null;

  function recorderAvailable() {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia &&
               (window.MediaRecorder || window.webkitMediaRecorder));
  }

  function startRecording() {
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function (stream) {
        mediaStream = stream;
        var MR = window.MediaRecorder || window.webkitMediaRecorder;
        var opts = {};
        if (MR.isTypeSupported && MR.isTypeSupported('audio/webm')) opts.mimeType = 'audio/webm';
        mediaRecorder = new MR(stream, opts);
        var chunks = [];
        mediaRecorder.ondataavailable = function (ev) { if (ev.data.size) chunks.push(ev.data); };
        mediaRecorder.onstop = function () {
          stream.getTracks().forEach(function (t) { t.stop(); });
          var blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          diag('recorded ' + blob.size + ' bytes — transcribing…');
          $('status-line').textContent = 'transcribing…';
          blobToWav16k(blob, function (wavBuf) {
            fetch('/api/transcribe', {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'audio/wav' },
              body: wavBuf
            })
              .then(function (r) { return r.json(); })
              .then(function (data) {
                if (data && data.text && data.text.trim()) {
                  send(data.text.trim());
                } else {
                  $('status-line').textContent = 'didn\'t catch that — try again.';
                }
              })
              .catch(function () {
                $('status-line').textContent = 'transcription failed — type instead.';
              });
          });
          recording = false;
          $('mic-btn').classList.remove('active');
        };
        mediaRecorder.start();
        recording = true;
        $('mic-btn').classList.add('active');
        $('status-line').classList.add('listening');
        $('status-line').textContent = 'recording… tap to stop and send';
        diag('recording started');
      })
      .catch(function (err) {
        diag('getUserMedia fail: ' + (err && err.name));
        $('status-line').textContent = 'mic blocked — allow it in the browser, or type.';
      });
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      try { mediaRecorder.stop(); } catch (e) { /* fine */ }
    }
  }

  function blobToWav16k(blob, cb) {
    var AC = window.AudioContext || window.webkitAudioContext;
    var ctx = new AC();
    var fr = new FileReader();
    fr.onload = function () {
      ctx.decodeAudioData(fr.result, function (buf) {
        var ch = buf.getChannelData(0);
        var rate = 16000;
        var ratio = buf.sampleRate / rate;
        var len = Math.max(1, Math.floor(ch.length / ratio));
        var pcm = new Int16Array(len);
        for (var i = 0; i < len; i++) {
          var s = ch[Math.floor(i * ratio)];
          s = Math.max(-1, Math.min(1, s));
          pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        var hdr = new ArrayBuffer(44);
        var dv = new DataView(hdr);
        function wstr(off, s) { for (var k = 0; k < s.length; k++) dv.setUint8(off + k, s.charCodeAt(k)); }
        wstr(0, 'RIFF'); dv.setUint32(4, 36 + pcm.length * 2, true); wstr(8, 'WAVE');
        wstr(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true);
        dv.setUint16(22, 1, true); dv.setUint32(24, rate, true); dv.setUint32(28, rate * 2, true);
        dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
        wstr(36, 'data'); dv.setUint32(40, pcm.length * 2, true);
        var out = new Uint8Array(hdr.byteLength + pcm.byteLength);
        out.set(new Uint8Array(hdr), 0);
        out.set(new Uint8Array(pcm.buffer), hdr.byteLength);
        cb(out.buffer);
      }, function (err) {
        diag('decode fail: ' + (err && err.message ? err.message : err));
        $('status-line').textContent = 'couldn\'t process the recording — type instead.';
      });
    };
    fr.onerror = function () {
      diag('file read fail');
      $('status-line').textContent = 'couldn\'t read the recording — type instead.';
    };
    fr.readAsArrayBuffer(blob);
  }

  /* ---------- mic button ---------- */
  $('mic-btn').addEventListener('click', function () {
    if ($('mic-btn').classList.contains('disabled')) return;
    unlockSpeech();
    if (speaking) {
      stopAudio();
      speaking = false;
      awaitingReply = false;
    }
    if (srAvailable()) {
      if (listening) {
        wantListening = false;
        try { rec.stop(); } catch (e) { /* not started */ }
      } else {
        wantListening = true;
        tryStart();
      }
    } else if (recorderAvailable()) {
      if (recording) {
        stopRecording();
      } else {
        startRecording();
      }
    }
  });

  function stopAudio() {
    if (curAudio) {
      try { curAudio.pause(); } catch (e) {}
      curAudio = null;
    }
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }

  $('voice-toggle').addEventListener('change', function () {
    voiceOn = this.checked;
    if (!voiceOn) {
      stopAudio();
      speaking = false;
    }
  });

  /* ---------- tts ---------- */
  // ios/autoplay policy: speechSynthesis only works after it's been triggered
  // inside a user gesture. speak a silent blip on every tap so later replies
  // (which arrive from async fetches, outside gesture context) are allowed.
  function unlockSpeech() {
    if (!('speechSynthesis' in window)) return;
    try {
      var u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      window.speechSynthesis.speak(u);
    } catch (e) { /* ignore */ }
  }

  function speak(text) {
    if (!voiceOn) { awaitingReply = false; scheduleResume(600); return; }
    speaking = true;
    // server-side neural voice first (same good voice on every browser)
    fetch('/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ text: text })
    })
      .then(function (r) {
        if (!r.ok) throw new Error('tts ' + r.status);
        return r.blob();
      })
      .then(function (blob) {
        var url = URL.createObjectURL(blob);
        var a = new Audio();
        curAudio = a;
        a.src = url;
        a.onended = function () {
          URL.revokeObjectURL(url);
          speaking = false; awaitingReply = false;
          diag('tts end');
          scheduleResume(350);
        };
        a.onerror = function () {
          URL.revokeObjectURL(url);
          fallbackSpeak(text);
        };
        a.play().catch(function () { fallbackSpeak(text); });
        diag('tts server (' + blob.size + ' bytes)');
      })
      .catch(function () {
        fallbackSpeak(text);
      });
  }

  function fallbackSpeak(text) {
    if (!('speechSynthesis' in window)) { speaking = false; awaitingReply = false; scheduleResume(600); return; }
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 1.0;
      u.onend = function () { speaking = false; awaitingReply = false; diag('tts local end'); scheduleResume(350); };
      u.onerror = function (ev) {
        speaking = false; awaitingReply = false;
        diag('tts local error: ' + (ev.error || 'unknown'));
        scheduleResume(350);
      };
      window.speechSynthesis.speak(u);
      diag('tts local fallback');
    } catch (e) {
      speaking = false; awaitingReply = false;
      diag('tts throw: ' + e);
      scheduleResume(350);
    }
  }

  /* ---------- chat ---------- */
  function send(text) {
    addMsg('user', text);
    awaitingReply = true;
    $('status-line').classList.remove('listening');
    $('status-line').textContent = 'thinking…';
    var think = addThinking();
    api('/api/chat', { text: text })
      .then(function (r) {
        if (r.status === 401) { showLogin(); return; }
        return r.json();
      })
      .then(function (data) {
        if (think.parentNode) think.parentNode.removeChild(think);
        if (data && data.reply) {
          addMsg('alma', data.reply);
          speak(data.reply);
        } else {
          awaitingReply = false;
          scheduleResume();
        }
      })
      .catch(function () {
        if (think.parentNode) think.parentNode.removeChild(think);
        addMsg('alma', 'couldn\'t reach the backend. try again.');
        awaitingReply = false;
        scheduleResume();
      });
  }

  $('send-btn').addEventListener('click', function () {
    unlockSpeech();
    var v = $('text-input').value.trim();
    if (!v) return;
    $('text-input').value = '';
    send(v);
  });
  $('text-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      unlockSpeech();
      var v = $('text-input').value.trim();
      if (!v) return;
      $('text-input').value = '';
      send(v);
    }
  });

  /* ---------- boot ---------- */
  if (srAvailable()) {
    initSR();
  } else if (!SR) {
    if (recorderAvailable()) {
      $('status-line').textContent = 'no cloud recognition here — tap the mic to record, tap again to send.';
      diag('sr absent — recorder mode');
    } else {
      $('mic-btn').classList.add('disabled');
      $('mic-btn').title = 'browser has no mic support — type instead';
      $('status-line').textContent = 'this browser can\'t hear — type instead.';
    }
  }

  (function () {
    var ua = navigator.userAgent;
    var browser = ua.indexOf('Edg') >= 0 ? 'edge' :
                  ua.indexOf('Chrome') >= 0 ? 'chrome' :
                  ua.indexOf('Safari') >= 0 ? 'safari' :
                  ua.indexOf('Firefox') >= 0 ? 'firefox' : 'other';
    var envMsg = browser + ' · sr:' + (srAvailable() ? 'yes' : 'no') +
                 ' · rec:' + (recorderAvailable() ? 'yes' : 'no') +
                 ' · tts:' + ('speechSynthesis' in window ? 'yes' : 'no') +
                 ' · ' + (navigator.platform || 'unknown-platform');
    diag(envMsg);
  })();
  api('/api/session').then(function (r) {
    if (r.ok) { showChat(); greet(); }
    else { showLogin(); }
  }).catch(function () { showLogin(); });
})();
</script>
